# ---------------------------------------------------------------------------
# Profile 'mysql' - dung MySQL/MariaDB nhu bai giang (Buoc 4).
#
# Chay:
#   APP_DB_PASSWORD='mat-khau-cua-ban' mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Hoac:
#   APP_DB_PASSWORD='...' java -jar target/bai04-jwt-nimbus-1.0.0.jar --spring.profiles.active=mysql
#
# Ten bien moi truong va gia tri mac dinh duoc dat TRUNG voi cac du an khac trong
# thu muc Lap-trinh-Web (Assignment05, Assignment06, DeThiQuaTrinh03, Web-Project-24162120)
# de chi can dung mot cach cau hinh duy nhat:
#
#   APP_DB_URL       (mac dinh: jdbc:mysql://localhost:3306/jwt_springboot3?...)
#   APP_DB_USERNAME  (mac dinh: thien)
#   APP_DB_PASSWORD  (mac dinh: rong)
#
# Khac du an khac o cho: ten database mac dinh la 'jwt_springboot3' (theo bai giang) chu
# khong phai 'thien', de bang 'users' cua bai JWT khong dung do voi bang cua du an khac.
# Tham so createDatabaseIfNotExist=true giup tu tao database neu tai khoan co quyen,
# nen khong bat buoc phai tao database truoc bang tay.
# ---------------------------------------------------------------------------
spring.datasource.url=${APP_DB_URL:jdbc:mysql://localhost:3306/jwt_springboot3?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&sslMode=PREFERRED&createDatabaseIfNotExist=true}
spring.datasource.username=${APP_DB_USERNAME:thien}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Khai bao tuong minh dialect MySQL (giong cac du an khac trong Lap-trinh-Web). Can thiet vi:
#  - XAMPP phan phoi kem MariaDB, ma Hibernate 6.6 khong doc duoc metadata cua MariaDB
#    (loi "Unknown column 'RESERVED' in 'WHERE'") nen KHONG tu nhan dien duoc dialect.
#  - Van dung voi MySQL 8 that; chi phat sinh canh bao HHH90000025 (khong anh huong hoat dong).
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console khong co y nghia voi MySQL
spring.h2.console.enabled=false
