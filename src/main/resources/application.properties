spring.application.name=Bai04-JWT-Nimbus
server.port=8005

# ---------------------------------------------------------------------------
# Datasource - mac dinh dung H2 in-memory de chay duoc ngay, khong can MySQL.
# Muon dung MySQL nhu trong bai giang: --spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:jwt_nimbus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## Hibernate properties (giong bai giang)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## Chi bat H2 console khi thuc su can. CANH BAO: khi bat, duong dan /h2-console/** duoc phep
## KHONG can dang nhap, va H2 console co the doc toan bo bang users (ke ca hash mat khau).
## Chi nen bat khi chay local mot minh:
##   mvn spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JWT (Nimbus JOSE+JWT)
#
# KHONG co khoa mac dinh nao duoc nhung trong source. Neu dat JWT_SECRET_KEY thi dung gia tri do
# (phai >= 256 bit = 32 byte). Neu KHONG dat, ung dung se tu sinh mot khoa ngau nhien 256 bit
# va luu vao file .jwt-secret-key trong thu muc lam viec (quyen chi chu so huu, da co trong
# .gitignore) - nho vay token van con hieu luc sau khi restart, va moi may co mot khoa rieng.
# Tao khoa de dat qua bien moi truong: openssl rand -hex 32
#
# Ly do khong de khoa mac dinh: bat ky ai doc duoc source deu ky duoc token gia mao bat ky
# nguoi dung nao. Xem docs/SECURITY-REVIEW.md muc 3.3.
# ---------------------------------------------------------------------------
security.jwt.secret-key=${JWT_SECRET_KEY:}
# Vi tri file khoa sinh tu dong (chi dung khi khong dat JWT_SECRET_KEY). Thuong de mac dinh.
security.jwt.secret-file=${JWT_SECRET_FILE:.jwt-secret-key}
# 1h in millisecond (giong bai giang)
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:3600000}
security.jwt.issuer=${JWT_ISSUER:jwt-nimbus-demo}

# ---------------------------------------------------------------------------
# CORS: chi cho phep origin cu the, khong dung "*"
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8005}

# ---------------------------------------------------------------------------
# Tai khoan demo (tuy chon). De trong = khong tao. Nen dang ky qua /register.
# ---------------------------------------------------------------------------
app.demo-user.enabled=${DEMO_USER_ENABLED:false}
app.demo-user.email=${DEMO_USER_EMAIL:demo@example.test}
app.demo-user.password=${DEMO_USER_PASSWORD:}
app.demo-user.full-name=${DEMO_USER_FULL_NAME:Demo User}

logging.level.vn.iotstar.jwtnimbus=INFO
