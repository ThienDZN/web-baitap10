<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dang ky - JWT Nimbus</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<main class="card">
    <h1>Dang ky</h1>
    <p class="muted">Tao tai khoan de nhan JWT tu <code>POST /auth/signup</code></p>

    <form id="registerForm" novalidate>
        <label for="fullName">Ho ten</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>

        <label for="password">Password (toi thieu 8 ky tu)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>

        <button id="Register" type="submit">Dang ky</button>
    </form>

    <p id="feedback" class="feedback" role="alert"></p>

    <p class="muted">Da co tai khoan? <a th:href="@{/login}" href="/login">Dang nhap</a></p>
</main>

<script th:src="@{/js/mainjs.js}" src="/js/mainjs.js"></script>
</body>
</html>
